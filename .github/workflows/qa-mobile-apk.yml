name: APK móvil ZAV

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/src/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
  push:
    branches:
      - main
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/src/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/tsconfig.json"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/qa-mobile-apk.yml"
  workflow_dispatch:

concurrency:
  group: apk-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir-apk:
    name: Construir APK Android autónomo
    runs-on: ubuntu-latest
    env:
      CI: 1
      BUILD_CHANNEL: ${{ github.event_name == 'pull_request' && 'qa' || 'release' }}
      EXPO_PUBLIC_API_BASE_URL: ${{ github.event_name == 'pull_request' && 'http://127.0.0.1:3001' || 'https://zav-api-2026.onrender.com' }}
      EXPO_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar credenciales de firma Android
        shell: bash
        run: |
          faltantes=0
          for nombre in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!nombre:-}" ]; then
              echo "::error::Falta el secreto $nombre."
              faltantes=1
            fi
          done
          if [ "$faltantes" -ne 0 ]; then
            echo "::error::No se generará un APK release con la firma de depuración de la plantilla."
            exit 1
          fi

      - name: Preparar firma y obtener SHA-1
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/zav-vendedor-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Huella del certificado que firmará el APK:"
          keytool -list -v             -keystore "$KEYSTORE_PATH"             -alias "$ANDROID_KEY_ALIAS"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             | grep -E "SHA1:|SHA-1:"

      - name: Generar proyecto Android
        run: pnpm --filter @zav/mobile exec expo prebuild --platform android --no-install --clean

      - name: Habilitar HTTP local solo en APK QA
        if: env.BUILD_CHANNEL == 'qa'
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path("apps/mobile/android/app/src/main/AndroidManifest.xml")
          text = manifest.read_text(encoding="utf-8")
          if 'android:usesCleartextTraffic=' not in text:
              text = text.replace(
                  '<application ',
                  '<application android:usesCleartextTraffic="true" ',
                  1,
              )
          else:
              import re
              text = re.sub(
                  r'android:usesCleartextTraffic="[^"]*"',
                  'android:usesCleartextTraffic="true"',
                  text,
                  count=1,
              )
          manifest.write_text(text, encoding="utf-8")
          print("AndroidManifest QA habilitado para http://127.0.0.1 mediante adb reverse.")
          PY

      - name: Configurar firma release estable
        shell: bash
        run: |
          cat > apps/mobile/android/app/zav-signing.gradle <<'GRADLE'
          android {
            signingConfigs {
              zavRelease {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }

            buildTypes {
              release {
                signingConfig signingConfigs.zavRelease
              }
            }
          }
          GRADLE

          printf '\napply from: "./zav-signing.gradle"\n' >> apps/mobile/android/app/build.gradle

      - name: Compilar APK autónomo de revisión
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verificar identidad, versión, firma y bundle JavaScript
        working-directory: apps/mobile/android
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "assets/index.android.bundle"

          if unzip -l "$APK" | grep -Eiq 'expo-logo|react-logo|expo-badge|tutorial-web|tabIcons|explore\.png|home\.png'; then
            echo "::error::El APK contiene recursos residuales de la plantilla Expo."
            exit 1
          fi

          if unzip -p "$APK" assets/index.android.bundle | strings | grep -Eiq 'Edit src/app|Welcome to Expo|Explore tab'; then
            echo "::error::El bundle contiene textos residuales de la plantilla Expo."
            exit 1
          fi

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING"

          printf '%s\n' "$BADGING" | grep -F "package: name='bo.zav.gestion.vendedor' versionCode='10000' versionName='1.0.0'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'ZAV Vendedor'"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          VERSION="$(node -p "require('../app.json').expo.version")"
          VERSION_CODE="$(node -p "require('../app.json').expo.android.versionCode")"
          SALIDA="../dist"
          NOMBRE_APK="ZAV-Vendedor-${VERSION}-build${VERSION_CODE}-${BUILD_CHANNEL}.apk"

          mkdir -p "$SALIDA"
          cp "$APK" "$SALIDA/$NOMBRE_APK"
          sha256sum "$SALIDA/$NOMBRE_APK" | tee "$SALIDA/$NOMBRE_APK.sha256"

          echo "APK versionado: $SALIDA/$NOMBRE_APK"

      - name: Guardar APK autónomo versionado
        uses: actions/upload-artifact@v4
        with:
          name: ZAV-Vendedor-1.0.0-build10000-${{ env.BUILD_CHANNEL }}-run-${{ github.run_number }}
          path: |
            apps/mobile/dist/ZAV-Vendedor-1.0.0-build10000-${{ env.BUILD_CHANNEL }}.apk
            apps/mobile/dist/ZAV-Vendedor-1.0.0-build10000-${{ env.BUILD_CHANNEL }}.apk.sha256
          if-no-files-found: error
          retention-days: 30

      - name: Guardar APK para evidencia visual
        if: github.event_name == 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: zav-vendedor-apk-evidencia-${{ github.run_number }}
          path: apps/mobile/dist/ZAV-Vendedor-1.0.0-build10000-qa.apk
          if-no-files-found: error
          retention-days: 7

  evidencias-android:
    name: Capturar evidencia Android real
    if: github.event_name == 'pull_request'
    needs: construir-apk
    runs-on: ubuntu-latest
    timeout-minutes: 45

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zav_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zav_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zav_test
      JWT_SECRET: zav-qa-jwt-secret-evidencias-movil-0123456789abcdef
      QA_ADMIN_IDENTIFICADOR: admin@zav.test
      QA_ADMIN_PASSWORD: AdminQA2026
      QA_VENDEDOR_IDENTIFICADOR: vendedor@zav.test
      QA_VENDEDOR_PASSWORD: VendedorQA2026

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Preparar PostgreSQL aislado
        run: NODE_ENV=test node -e "import('./apps/api/test/global-setup-e2e.mjs').then((m) => m.default())"

      - name: Compilar e iniciar API local
        shell: bash
        run: |
          pnpm --filter @zav/api build
          NODE_ENV=test PORT=3001 pnpm --filter @zav/api start:prod > /tmp/zav-api-mobile.log 2>&1 &
          for intento in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/salud > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zav-api-mobile.log
          exit 1

      - name: Sembrar datos sintéticos para las capturas
        shell: bash
        run: |
          node <<'NODE'
          const API='http://127.0.0.1:3001';
          const post=async(path,token,data)=>{
            const r=await fetch(API+path,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify(data)});
            const body=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(path+' '+r.status+' '+JSON.stringify(body));
            return body;
          };
          const login=async(id,pw)=>(await post('/api/v1/auth/login',null,{identificador:id,contrasena:pw})).accessToken;
          const admin=await login(process.env.QA_ADMIN_IDENTIFICADOR,process.env.QA_ADMIN_PASSWORD);
          const producto=await post('/api/v1/productos',admin,{codigo:'QA-MOBILE-01',nombre:'Jamón cocido QA',familia:'Fiambres',presentacion:'Unidad de 250 g',pesoGramos:250,precioBob:24.5});
          const lote=await post('/api/v1/lotes',admin,{operacionClave:crypto.randomUUID(),productoId:producto.id,codigo:'LOTE-QA-MOBILE-01',elaboradoEl:'2026-10-01',venceEl:'2026-12-31',cantidadInicial:12,ubicacionCodigo:'PRODUCCION_ALMACENAMIENTO'});
          await post('/api/v1/lotes/'+lote.id+'/liberar',admin,{operacionClave:crypto.randomUUID(),motivo:'Datos sintéticos para evidencia visual'});
          await post('/api/v1/movimientos/traslado',admin,{operacionClave:crypto.randomUUID(),loteId:lote.id,origenCodigo:'PRODUCCION_ALMACENAMIENTO',destinoCodigo:'VENTA_DESPACHO',cantidad:10,referencia:'QA-MOBILE'});
          const vendedor=await login(process.env.QA_VENDEDOR_IDENTIFICADOR,process.env.QA_VENDEDOR_PASSWORD);
          const cliente1=await post('/api/v1/clientes',vendedor,{nombre:'Cliente Centro QA',telefono:'70000001',direccion:'Zona central, Tarija',latitud:-21.535,longitud:-64.730});
          const cliente2=await post('/api/v1/clientes',vendedor,{nombre:'Cliente Sur QA',telefono:'70000002',direccion:'Zona sur, Tarija',latitud:-21.548,longitud:-64.720});
          await post('/api/v1/pedidos',vendedor,{clienteId:cliente1.id,observacion:'Pedido sintético para evidencia visual',detalles:[{productoId:producto.id,cantidad:2}]});
          const pedido2=await post('/api/v1/pedidos',vendedor,{clienteId:cliente2.id,observacion:'Segundo pedido sintético para evidencia visual',detalles:[{productoId:producto.id,cantidad:1}]});
          await post('/api/v1/pedidos/'+pedido2.id+'/retiro',vendedor,{operacionClave:crypto.randomUUID()});
          NODE

      - name: Descargar APK de QA
        uses: actions/download-artifact@v4
        with:
          name: zav-vendedor-apk-evidencia-${{ github.run_number }}
          path: /tmp/zav-apk

      - name: Ejecutar APK y capturar pantallas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot -memory 2048 -cores 2 -feature -Vulkan
          script: |
            adb install -r /tmp/zav-apk/ZAV-Vendedor-1.0.0-build10000-qa.apk
            adb reverse tcp:3001 tcp:3001
            python3 apps/mobile/scripts/capturar-evidencias-movil.py

      - name: Guardar capturas Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-movil-verificables-${{ github.run_number }}
          path: |
            apps/mobile/test-results/evidencias-movil/
            /tmp/zav-api-mobile.log
          retention-days: 30
          if-no-files-found: error
