name: 04 · Android — Compilación APK

on:
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/qa-mobile-apk.yml"
  push:
    branches:
      - main
    paths:
      - "apps/mobile/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/qa-mobile-apk.yml"
  workflow_dispatch:
    inputs:
      canal:
        description: Canal de compilación (no cambia la rama ni despliega la API)
        type: choice
        options: [qa, release]
        default: qa
        required: true
      apk_qa_run_id:
        description: ID de una ejecución previa de este repositorio para repetir QA sobre su APK (vacío compila)
        type: string
        default: ''
        required: false

concurrency:
  group: apk-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  construir-apk:
    if: github.event_name != 'workflow_dispatch' || inputs.apk_qa_run_id == ''
    name: Construir APK Android autónomo
    runs-on: ubuntu-latest
    env:
      CI: 1
      BUILD_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.canal || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'release' || 'qa') }}
      EXPO_PUBLIC_BUILD_CHANNEL: ${{ github.event_name == 'workflow_dispatch' && inputs.canal || (github.ref == 'refs/heads/main' && github.event_name != 'pull_request' && 'release' || 'qa') }}
      EXPO_PUBLIC_API_BASE_URL: ${{ ((github.event_name == 'workflow_dispatch' && inputs.canal == 'release') || (github.event_name == 'push' && github.ref == 'refs/heads/main')) && 'https://zav-api-2026.onrender.com' || (vars.ZAV_QA_API_BASE_URL || 'http://10.0.2.2:3001') }}
      EXPO_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Validar destino de la API y version Android
        shell: bash
        run: |
          set -euo pipefail
          if [ "$BUILD_CHANNEL" = "qa" ]; then
            case "$EXPO_PUBLIC_API_BASE_URL" in
              https://zav-api-2026.onrender.com* )
                echo "::error::El APK QA no puede conectar con produccion."; exit 1 ;;
              http://*|https://* ) ;;
              * ) echo "::error::URL de QA invalida."; exit 1 ;;
            esac
          fi
          VERSION="$(node -p "require('./apps/mobile/app.json').expo.version")"
          BUILD_CODE="$(node -p "require('./apps/mobile/app.json').expo.android.versionCode")"
          echo "APK_ARTIFACT_NAME=ZAV-Vendedor-${VERSION}-build${BUILD_CODE}-${BUILD_CHANNEL}-run-${GITHUB_RUN_NUMBER}" >> "$GITHUB_ENV"
      - name: Verificar separación de configuración QA y release
        shell: bash
        run: |
          EXPO_PUBLIC_BUILD_CHANNEL=qa node - <<'NODE'
          const cfg = require('./apps/mobile/app.config.js')({ config: require('./apps/mobile/app.json').expo });
          if (cfg.android.package !== 'bo.zav.gestion.vendedor.qa' ||
              cfg.name !== 'ZAV Vendedor QA' ||
              !cfg.plugins.includes('./plugins/with-qa-local-network')) {
            throw new Error('Configuración Android QA incorrecta');
          }
          NODE
          EXPO_PUBLIC_BUILD_CHANNEL=release node - <<'NODE'
          const cfg = require('./apps/mobile/app.config.js')({ config: require('./apps/mobile/app.json').expo });
          if (cfg.android.package !== 'bo.zav.gestion.vendedor' ||
              cfg.name !== 'ZAV Vendedor' ||
              cfg.plugins.includes('./plugins/with-qa-local-network')) {
            throw new Error('Configuración Android release incorrecta');
          }
          NODE

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Verificar credenciales de firma Android
        shell: bash
        run: |
          faltantes=0
          for nombre in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!nombre:-}" ]; then
              echo "::error::Falta el secreto $nombre."
              faltantes=1
            fi
          done
          if [ "$faltantes" -ne 0 ]; then
            echo "::error::No se generará un APK release con la firma de depuración de la plantilla."
            exit 1
          fi

      - name: Preparar firma y obtener SHA-1
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/zav-vendedor-release.jks"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "ANDROID_KEYSTORE_FILE=$KEYSTORE_PATH" >> "$GITHUB_ENV"

          echo "Huella del certificado que firmará el APK:"
          keytool -list -v             -keystore "$KEYSTORE_PATH"             -alias "$ANDROID_KEY_ALIAS"             -storepass "$ANDROID_KEYSTORE_PASSWORD"             | grep -E "SHA1:|SHA-1:"

      - name: Generar proyecto Android
        run: pnpm --filter @zav/mobile exec expo prebuild --platform android --no-install --clean

      - name: Configurar firma release estable
        shell: bash
        run: |
          cat > apps/mobile/android/app/zav-signing.gradle <<'GRADLE'
          android {
            signingConfigs {
              zavRelease {
                storeFile file(System.getenv("ANDROID_KEYSTORE_FILE"))
                storePassword System.getenv("ANDROID_KEYSTORE_PASSWORD")
                keyAlias System.getenv("ANDROID_KEY_ALIAS")
                keyPassword System.getenv("ANDROID_KEY_PASSWORD")
              }
            }

            buildTypes {
              release {
                signingConfig signingConfigs.zavRelease
              }
            }
          }
          GRADLE

          printf '\napply from: "./zav-signing.gradle"\n' >> apps/mobile/android/app/build.gradle

      - name: Compilar APK autónomo de revisión
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease --no-daemon

      - name: Verificar identidad, versión, firma y bundle JavaScript
        working-directory: apps/mobile/android
        shell: bash
        run: |
          APK="app/build/outputs/apk/release/app-release.apk"
          test -f "$APK"
          unzip -l "$APK" | grep -q "assets/index.android.bundle"

          if unzip -l "$APK" | grep -Eiq 'expo-logo|react-logo|expo-badge|tutorial-web|tabIcons|explore\.png|home\.png'; then
            echo "::error::El APK contiene recursos residuales de la plantilla Expo."
            exit 1
          fi

          if unzip -p "$APK" assets/index.android.bundle | strings | grep -Eiq 'Edit src/app|Welcome to Expo|Explore tab'; then
            echo "::error::El bundle contiene textos residuales de la plantilla Expo."
            exit 1
          fi

          AAPT="$(find "$ANDROID_HOME/build-tools" -type f -name aapt | sort -V | tail -n 1)"
          test -n "$AAPT"
          BADGING="$("$AAPT" dump badging "$APK")"
          printf '%s\n' "$BADGING"

          VERSION="$(node -p "require('../app.json').expo.version")"
          VERSION_CODE="$(node -p "require('../app.json').expo.android.versionCode")"
          if [ "$BUILD_CHANNEL" = "qa" ]; then
            PACKAGE="bo.zav.gestion.vendedor.qa"
            ETIQUETA="ZAV Vendedor QA"
          else
            PACKAGE="bo.zav.gestion.vendedor"
            ETIQUETA="ZAV Vendedor"
          fi
          printf '%s\n' "$BADGING" | grep -F "package: name='$PACKAGE' versionCode='$VERSION_CODE' versionName='$VERSION'"
          printf '%s\n' "$BADGING" | grep -F "application-label:'$ETIQUETA'"

          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose --print-certs "$APK"

          "$AAPT" dump xmltree "$APK" AndroidManifest.xml > "$RUNNER_TEMP/zav-manifest.txt"
          python3 - <<'PY'
          import os
          from pathlib import Path
          manifest = Path(os.environ['RUNNER_TEMP'], 'zav-manifest.txt').read_text()
          habilitado = any('usesCleartextTraffic' in linea and '0xffffffff' in linea for linea in manifest.splitlines())
          assert habilitado == (os.environ['BUILD_CHANNEL'] == 'qa'), 'HTTP local debe habilitarse solamente en QA'
          PY

          VERSION="$(node -p "require('../app.json').expo.version")"
          VERSION_CODE="$(node -p "require('../app.json').expo.android.versionCode")"
          SALIDA="../dist"
          NOMBRE_APK="ZAV-Vendedor-${VERSION}-build${VERSION_CODE}-${BUILD_CHANNEL}.apk"

          mkdir -p "$SALIDA"
          cp "$APK" "$SALIDA/$NOMBRE_APK"
          sha256sum "$SALIDA/$NOMBRE_APK" | tee "$SALIDA/$NOMBRE_APK.sha256"

          echo "APK versionado: $SALIDA/$NOMBRE_APK"

      - name: Guardar APK autónomo versionado
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.APK_ARTIFACT_NAME }}
          path: |
            apps/mobile/dist/ZAV-Vendedor-*.apk
            apps/mobile/dist/ZAV-Vendedor-*.apk.sha256
          if-no-files-found: error
          retention-days: 30

  verificar-hora-android:
    name: Verificar hora QA en Android
    needs: construir-apk
    if: always() && (needs.construir-apk.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.canal == 'qa' && inputs.apk_qa_run_id != '')) && ((github.event_name == 'workflow_dispatch' && inputs.canal == 'qa') || (github.event_name != 'workflow_dispatch' && (github.ref != 'refs/heads/main' || github.event_name == 'pull_request')))
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          pattern: ZAV-Vendedor-*-qa-run-*
          run-id: ${{ inputs.apk_qa_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: apk-qa
          merge-multiple: true
      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Comprobar hora boliviana con Android en UTC y Tokio
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 apps/mobile/scripts/qa-hora-android.py
      - name: Conservar evidencia de hora Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hora-bolivia-android-${{ github.run_number }}
          path: evidencias-hora-android/
          retention-days: 30

  verificar-ventas-android:
    name: Verificar venta directa en APK y PostgreSQL
    needs: construir-apk
    if: always() && (needs.construir-apk.result == 'success' || (github.event_name == 'workflow_dispatch' && inputs.canal == 'qa' && inputs.apk_qa_run_id != '')) && ((github.event_name == 'workflow_dispatch' && inputs.canal == 'qa') || (github.event_name != 'workflow_dispatch' && (github.ref != 'refs/heads/main' || github.event_name == 'pull_request')))
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zav_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U postgres -d zav_test"
          --health-interval 10s --health-timeout 5s --health-retries 5
    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zav_test
      JWT_SECRET: zav-qa-jwt-secret-solo-pruebas-2026-0123456789abcdef
      QA_ADMIN_IDENTIFICADOR: admin@zav.test
      QA_ADMIN_PASSWORD: Admin-QA-2026-Pruebas!
      QA_VENDEDOR_IDENTIFICADOR: vendedor@zav.test
      QA_VENDEDOR_PASSWORD: Vendedor-QA-2026-Pruebas!
      PORT: '3001'
      QA_APK_RUN_ID: ${{ inputs.apk_qa_run_id || github.run_id }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: actions/download-artifact@v4
        with:
          pattern: ZAV-Vendedor-*-qa-run-*
          run-id: ${{ inputs.apk_qa_run_id || github.run_id }}
          github-token: ${{ github.token }}
          path: apk-qa
          merge-multiple: true
      - name: Preparar API y PostgreSQL de ensayo
        run: |
          pnpm install --frozen-lockfile
          node -e "import('./apps/api/test/global-setup-e2e.mjs').then(m => m.default())"
          pnpm --filter @zav/api build
          pnpm --filter @zav/api start:prod > "$RUNNER_TEMP/api-ventas-qa.log" 2>&1 &
          for intento in $(seq 1 30); do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/salud; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Habilitar aceleración del emulador
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Carga, recepción, venta con GPS y devolución con conciliación
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          target: google_apis
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          script: python3 apps/mobile/scripts/qa-ventas-android.py
      - name: Conservar resultados reales del APK
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ventas-directas-android-${{ github.run_number }}
          path: |
            evidencias-ventas-android/
            ${{ runner.temp }}/api-ventas-qa.log
          retention-days: 30
