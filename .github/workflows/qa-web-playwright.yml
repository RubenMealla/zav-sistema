name: QA web Playwright

on:
  push:
    branches:
      - "pruebas/**"
      - "desarrollo/**"
  pull_request:
    branches:
      - main

concurrency:
  group: qa-web-playwright-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar-web:
    name: Verificar interfaz web
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zav_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zav_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zav_test
      JWT_SECRET: zav-qa-jwt-secret-solo-pruebas-2026-0123456789abcdef
      QA_ADMIN_IDENTIFICADOR: admin.qa
      QA_ADMIN_PASSWORD: Admin-QA-2026-Pruebas!
      QA_VENDEDOR_IDENTIFICADOR: vendedor.qa
      QA_VENDEDOR_PASSWORD: Vendedor-QA-2026-Pruebas!
      API_BASE_URL: http://127.0.0.1:3001

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Instalar Chromium para Playwright
        run: pnpm --filter @zav/web exec playwright install --with-deps chromium

      - name: Preparar PostgreSQL aislado
        run: NODE_ENV=test node -e "import('./apps/api/test/global-setup-e2e.mjs').then((m) => m.default())"

      - name: Compilar API
        run: pnpm --filter @zav/api build

      - name: Verificar lint web
        run: pnpm --filter @zav/web lint

      - name: Compilar web
        run: pnpm --filter @zav/web build

      - name: Ejecutar Playwright
        run: pnpm --filter @zav/web test:e2e

      - name: Guardar evidencias Playwright
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-web-playwright-${{ github.run_number }}
          path: |
            apps/web/playwright-report/
            apps/web/test-results/
          retention-days: 30
          if-no-files-found: warn
