name: 07 · Seguridad — Archivos y credenciales

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verificar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Rechazar archivos privados y compilados
        run: node scripts/verificar-archivos-publicados.mjs
      - name: Instalar escáner verificado
        shell: bash
        run: |
          set -euo pipefail
          curl --fail --silent --show-error --location --retry 3 https://github.com/gitleaks/gitleaks/releases/download/v8.30.1/gitleaks_8.30.1_linux_x64.tar.gz -o "$RUNNER_TEMP/gitleaks.tar.gz"
          echo "551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
      - name: Examinar historial sin revelar valores
        run: '"$RUNNER_TEMP/gitleaks" git . --log-opts=--all --redact=100 --no-banner --report-format=json --report-path=secretos-redactados.json'
      - name: Conservar resultado redactado
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: revision-seguridad-${{ github.run_id }}
          path: secretos-redactados.json
          if-no-files-found: ignore
          retention-days: 30
