name: Actualizar lock mobile temporal

on:
  push:
    branches:
      - desarrollo/e3-app-movil-vendedor
    paths:
      - apps/mobile/package.json

permissions:
  contents: write

jobs:
  actualizar-lock:
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: desarrollo/e3-app-movil-vendedor

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Regenerar lockfile
        run: pnpm install --lockfile-only --no-frozen-lockfile

      - name: Commit del lockfile
        shell: bash
        run: |
          if git diff --quiet -- pnpm-lock.yaml; then
            echo "pnpm-lock.yaml ya estaba actualizado."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add pnpm-lock.yaml
          git commit -m "chore(mobile): actualizar pnpm lock para Expo"
          git push origin HEAD:desarrollo/e3-app-movil-vendedor
