name: QA mobile

on:
  push:
    branches:
      - "desarrollo/**"
      - "correccion/**"
      - "pruebas/**"
      - "mejora/**"
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/src/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/tsconfig.json"
      - "apps/mobile/eslint.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/qa-mobile.yml"
  pull_request:
    branches:
      - main
    paths:
      - "apps/mobile/app/**"
      - "apps/mobile/src/**"
      - "apps/mobile/assets/**"
      - "apps/mobile/app.json"
      - "apps/mobile/package.json"
      - "apps/mobile/tsconfig.json"
      - "apps/mobile/eslint.config.js"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - ".github/workflows/qa-mobile.yml"

concurrency:
  group: qa-mobile-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar-mobile:
    name: Verificar app móvil
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Preparar carpeta de evidencias
        run: mkdir -p apps/mobile/test-results

      - name: Verificar lint móvil
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @zav/mobile lint 2>&1 | tee apps/mobile/test-results/lint.log

      - name: Verificar TypeScript móvil
        shell: bash
        run: |
          set -o pipefail
          pnpm --filter @zav/mobile exec tsc --noEmit 2>&1 | tee apps/mobile/test-results/typescript.log

      - name: Registrar resumen reproducible
        if: always()
        shell: bash
        run: |
          echo "QA mobile · ZAV Vendedor" > apps/mobile/test-results/resumen-qa.txt
          echo "commit=$GITHUB_SHA" >> apps/mobile/test-results/resumen-qa.txt
          echo "run_id=$GITHUB_RUN_ID" >> apps/mobile/test-results/resumen-qa.txt
          echo "run_number=$GITHUB_RUN_NUMBER" >> apps/mobile/test-results/resumen-qa.txt
          node --version >> apps/mobile/test-results/resumen-qa.txt
          pnpm --version >> apps/mobile/test-results/resumen-qa.txt

      - name: Guardar evidencias QA móvil
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-mobile-${{ github.run_number }}
          path: apps/mobile/test-results/
          retention-days: 30
          if-no-files-found: error
