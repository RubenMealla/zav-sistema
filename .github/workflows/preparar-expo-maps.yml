name: Preparar dependencia Expo Maps

on:
  push:
    branches:
      - "desarrollo/e3-app-movil-vendedor"

permissions:
  contents: write

concurrency:
  group: preparar-expo-maps-${{ github.ref }}
  cancel-in-progress: true

jobs:
  preparar:
    name: Resolver expo-maps y lockfile
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          ref: desarrollo/e3-app-movil-vendedor

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Instalar base
        run: pnpm install --frozen-lockfile

      - name: Resolver versión compatible de Expo Maps
        working-directory: apps/mobile
        run: pnpm exec expo install expo-maps

      - name: Versionar dependencia resuelta
        run: |
          if git diff --quiet -- apps/mobile/package.json pnpm-lock.yaml; then
            echo "Expo Maps ya estaba resuelto."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add apps/mobile/package.json pnpm-lock.yaml
          git commit -m "build(mobile): resolver Expo Maps para SDK 57"
          git push origin HEAD:desarrollo/e3-app-movil-vendedor
