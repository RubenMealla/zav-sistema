name: Evidencias móviles QA

on:
  push:
    branches:
      - pruebas/evidencias-qa-reales
    paths:
      - "apps/mobile/scripts/capturar-evidencias-movil.py"
      - ".github/workflows/evidencias-movil-qa.yml"
  workflow_dispatch:

concurrency:
  group: evidencias-movil-qa-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturas:
    name: Capturar ZAV Vendedor en Android
    runs-on: ubuntu-latest
    timeout-minutes: 50

    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: zav_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d zav_test"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    env:
      CI: 1
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/zav_test
      JWT_SECRET: zav-qa-jwt-secret-evidencias-movil-0123456789abcdef
      QA_ADMIN_IDENTIFICADOR: admin@zav.test
      QA_ADMIN_PASSWORD: AdminQA2026
      QA_VENDEDOR_IDENTIFICADOR: vendedor@zav.test
      QA_VENDEDOR_PASSWORD: VendedorQA2026
      EXPO_PUBLIC_API_BASE_URL: http://127.0.0.1:3001
      EXPO_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Restaurar caché Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Habilitar aceleración KVM del emulador
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -e /dev/kvm ]; then
            echo "No existe /dev/kvm en el runner."
            exit 1
          fi
          sudo chmod 666 /dev/kvm
          ls -l /dev/kvm
          test -r /dev/kvm
          test -w /dev/kvm
          echo "KVM accesible para el runner."

      - name: Preparar PostgreSQL aislado
        run: NODE_ENV=test node -e "import('./apps/api/test/global-setup-e2e.mjs').then((m) => m.default())"

      - name: Compilar e iniciar API local
        shell: bash
        run: |
          pnpm --filter @zav/api build
          NODE_ENV=test PORT=3001 pnpm --filter @zav/api start:prod > /tmp/zav-api-mobile.log 2>&1 &
          for intento in {1..60}; do
            if curl --fail --silent http://127.0.0.1:3001/api/v1/salud > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/zav-api-mobile.log
          exit 1

      - name: Sembrar datos sintéticos visibles
        shell: bash
        run: |
          node <<'NODE'
          const API='http://127.0.0.1:3001';
          const post=async(path,token,data)=>{
            const r=await fetch(API+path,{method:'POST',headers:{'content-type':'application/json',...(token?{authorization:'Bearer '+token}:{})},body:JSON.stringify(data)});
            const body=await r.json().catch(()=>({}));
            if(!r.ok) throw new Error(path+' '+r.status+' '+JSON.stringify(body));
            return body;
          };
          const login=async(id,pw)=>(await post('/api/v1/auth/login',null,{identificador:id,contrasena:pw})).accessToken;
          const admin=await login(process.env.QA_ADMIN_IDENTIFICADOR,process.env.QA_ADMIN_PASSWORD);
          const producto=await post('/api/v1/productos',admin,{
            codigo:'QA-MOBILE-01',
            nombre:'Jamón cocido QA',
            familia:'Fiambres',
            presentacion:'Unidad de 250 g',
            pesoGramos:250,
            precioBob:24.5
          });
          const lote=await post('/api/v1/lotes',admin,{
            operacionClave:crypto.randomUUID(),
            productoId:producto.id,
            codigo:'LOTE-QA-MOBILE-01',
            elaboradoEl:'2026-10-01',
            venceEl:'2026-12-31',
            cantidadInicial:12,
            ubicacionCodigo:'PRODUCCION_ALMACENAMIENTO'
          });
          await post('/api/v1/lotes/'+lote.id+'/liberar',admin,{
            operacionClave:crypto.randomUUID(),
            motivo:'Datos sintéticos para evidencia visual'
          });
          await post('/api/v1/movimientos/traslado',admin,{
            operacionClave:crypto.randomUUID(),
            loteId:lote.id,
            origenCodigo:'PRODUCCION_ALMACENAMIENTO',
            destinoCodigo:'VENTA_DESPACHO',
            cantidad:10,
            referencia:'QA-MOBILE'
          });

          const vendedor=await login(process.env.QA_VENDEDOR_IDENTIFICADOR,process.env.QA_VENDEDOR_PASSWORD);
          const cliente1=await post('/api/v1/clientes',vendedor,{
            nombre:'Cliente Centro QA',
            telefono:'70000001',
            direccion:'Zona central, Tarija',
            latitud:-21.535,
            longitud:-64.730
          });
          const cliente2=await post('/api/v1/clientes',vendedor,{
            nombre:'Cliente Sur QA',
            telefono:'70000002',
            direccion:'Zona sur, Tarija',
            latitud:-21.548,
            longitud:-64.720
          });
          const pedido1=await post('/api/v1/pedidos',vendedor,{
            clienteId:cliente1.id,
            observacion:'Pedido sintético para evidencia visual',
            detalles:[{productoId:producto.id,cantidad:2}]
          });
          const pedido2=await post('/api/v1/pedidos',vendedor,{
            clienteId:cliente2.id,
            observacion:'Segundo pedido sintético para evidencia visual',
            detalles:[{productoId:producto.id,cantidad:1}]
          });
          await post('/api/v1/pedidos/'+pedido2.id+'/retiro',vendedor,{
            operacionClave:crypto.randomUUID()
          });
          console.log('Datos sintéticos móviles creados:', pedido1.id, pedido2.id);
          NODE

      - name: Generar proyecto Android
        run: pnpm --filter @zav/mobile exec expo prebuild --platform android --no-install --clean

      - name: Compilar APK x86_64 para evidencia
        working-directory: apps/mobile/android
        env:
          GRADLE_OPTS: -Dorg.gradle.jvmargs="-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8"
        run: |
          chmod +x gradlew
          ./gradlew assembleRelease             -PreactNativeArchitectures=x86_64             --no-daemon             --build-cache             --max-workers=2             -x lintVitalRelease             -x lintVitalAnalyzeRelease

      - name: Verificar APK de evidencia antes del emulador
        shell: bash
        run: |
          APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"
          test -s "$APK"
          unzip -t "$APK" >/dev/null
          echo "APK de evidencia verificado: $(stat -c%s "$APK") bytes"

      - name: Ejecutar app y capturar pantallas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          disable-linux-hw-accel: false
          emulator-boot-timeout: 300
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none -no-snapshot -memory 3072 -cores 2
          script: |
            set -euo pipefail
            APK="apps/mobile/android/app/build/outputs/apk/release/app-release.apk"

            adb wait-for-device

            for intento in {1..60}; do
              BOOT="$(adb shell getprop sys.boot_completed 2>/dev/null | tr -d '\r' || true)"
              PM_READY="$(adb shell pm path android 2>/dev/null || true)"
              if [ "$BOOT" = "1" ] && [ -n "$PM_READY" ]; then
                echo "Android y Package Manager listos."
                break
              fi
              if [ "$intento" -eq 60 ]; then
                echo "El emulador arrancó, pero Package Manager no quedó estable."
                adb shell getprop || true
                exit 1
              fi
              sleep 2
            done

            adb shell settings put global verifier_verify_adb_installs 0 || true
            adb shell settings put global package_verifier_enable 0 || true

            adb push "$APK" /data/local/tmp/zav-evidencia.apk

            INSTALADO=0
            for intento in 1 2 3; do
              if adb shell pm install -r /data/local/tmp/zav-evidencia.apk; then
                INSTALADO=1
                break
              fi
              echo "Reintento de instalación $intento/3..."
              adb wait-for-device
              sleep 5
            done

            if [ "$INSTALADO" -ne 1 ]; then
              echo "No se pudo instalar el APK después de 3 intentos."
              adb shell dumpsys package | tail -n 120 || true
              exit 1
            fi

            adb shell pm path bo.zav.gestion.vendedor
            python3 apps/mobile/scripts/capturar-evidencias-movil.py

      - name: Guardar evidencias
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-movil-qa-${{ github.run_number }}
          path: |
            apps/mobile/test-results/evidencias-movil/
            /tmp/zav-api-mobile.log
          retention-days: 30
          if-no-files-found: warn
