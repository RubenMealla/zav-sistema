name: Evidencias Android E3

on:
  push:
    branches:
      - pruebas/e3-capturas-android
  workflow_dispatch:

concurrency:
  group: evidencias-android-e3-${{ github.ref }}
  cancel-in-progress: true

jobs:
  capturar:
    name: Capturar interfaz ZAV Vendedor
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      CI: 1
      EXPO_PUBLIC_API_BASE_URL: https://zav-api-2026.onrender.com
      EXPO_PUBLIC_MAP_STYLE_URL: https://tiles.openfreemap.org/styles/liberty

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Configurar pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 12.4.2
          run_install: false

      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      - name: Generar proyecto Android
        run: pnpm --filter @zav/mobile exec expo prebuild --platform android --no-install --clean

      - name: Compilar APK debug para evidencia
        working-directory: apps/mobile/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: Ejecutar app y capturar pantallas
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          script: |
            set -euo pipefail
            mkdir -p apps/mobile/test-results/evidencias-android
            APK="apps/mobile/android/app/build/outputs/apk/debug/app-debug.apk"
            adb install -r "$APK"
            adb shell pm clear bo.zav.gestion.vendedor
            adb shell monkey -p bo.zav.gestion.vendedor -c android.intent.category.LAUNCHER 1 >/dev/null
            sleep 8

            dump_ui() {
              adb shell uiautomator dump /sdcard/window.xml >/dev/null
              adb pull /sdcard/window.xml "$RUNNER_TEMP/window.xml" >/dev/null
            }

            find_center() {
              local objetivo="$1"
              dump_ui
              python3 - "$RUNNER_TEMP/window.xml" "$objetivo" <<'PY'
            import re,sys,xml.etree.ElementTree as ET
            archivo,objetivo=sys.argv[1],sys.argv[2]
            raiz=ET.parse(archivo).getroot()
            candidatos=[]
            for n in raiz.iter('node'):
                texto=(n.attrib.get('text') or '').strip()
                desc=(n.attrib.get('content-desc') or '').strip()
                if texto==objetivo or desc==objetivo or texto.startswith(objetivo) or desc.startswith(objetivo):
                    b=n.attrib.get('bounds','')
                    m=re.match(r'\[(\d+),(\d+)\]\[(\d+),(\d+)\]',b)
                    if m:
                        x1,y1,x2,y2=map(int,m.groups())
                        candidatos.append(((x1+x2)//2,(y1+y2)//2,texto,desc))
            if not candidatos:
                raise SystemExit(f'No se encontro: {objetivo}')
            x,y,_,_=candidatos[0]
            print(f'{x} {y}')
            PY
            }

            tap_objetivo() {
              local objetivo="$1"
              read -r x y <<<"$(find_center "$objetivo")"
              adb shell input tap "$x" "$y"
              sleep 1
            }

            wait_text() {
              local objetivo="$1"
              for i in $(seq 1 30); do
                dump_ui
                if python3 - "$RUNNER_TEMP/window.xml" "$objetivo" <<'PY'
            import sys,xml.etree.ElementTree as ET
            raiz=ET.parse(sys.argv[1]).getroot(); objetivo=sys.argv[2]
            ok=any(objetivo in ((n.attrib.get('text') or '')+' '+(n.attrib.get('content-desc') or '')) for n in raiz.iter('node'))
            raise SystemExit(0 if ok else 1)
            PY
                then return 0; fi
                sleep 1
              done
              echo "::error::No aparecio el texto esperado: $objetivo"
              dump_ui
              cat "$RUNNER_TEMP/window.xml"
              return 1
            }

            captura() {
              local nombre="$1"
              adb shell input keyevent 4 >/dev/null 2>&1 || true
              sleep 1
              adb exec-out screencap -p > "apps/mobile/test-results/evidencias-android/$nombre"
            }

            wait_text "Acceso del Vendedor"
            captura "01-login.png"

            tap_objetivo "Identificador"
            adb shell input text 'vendedor@saf.ts'
            tap_objetivo "Contraseña"
            adb shell input text '12345678'
            adb shell input keyevent 66
            wait_text "ZAV · VENDEDOR"
            sleep 5
            captura "02-pedidos.png"

            tap_objetivo "Clientes"
            wait_text "Directorio de clientes"
            captura "03-clientes.png"

            tap_objetivo "Definir ubicación"
            wait_text "Confirmar punto en mapa"
            sleep 8
            captura "04-mapa-cliente.png"

            tap_objetivo "Cerrar"
            wait_text "Directorio de clientes"
            tap_objetivo "Nuevo pedido"
            wait_text "Nuevo pedido"
            captura "05-nuevo-pedido.png"

            ls -lh apps/mobile/test-results/evidencias-android

      - name: Guardar evidencias Android
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evidencias-android-e3-${{ github.run_number }}
          path: apps/mobile/test-results/evidencias-android/
          if-no-files-found: error
          retention-days: 30
