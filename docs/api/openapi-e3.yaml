  /api/v1/operaciones/{id}:
    parameters:
      - $ref: "#/components/parameters/Id"
    get:
      summary: Detalle con lotes, movimientos y datos históricos; ajeno devuelve 404
      tags:
        - Operaciones
      responses:
        "200":
          description: Consulta correcta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Operacion"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  /api/v1/operaciones/disponibilidad:
    get:
      summary: Stock libre de despacho o propio según JWT
      tags:
        - Operaciones
      responses:
        "200":
          description: Consulta correcta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DisponibilidadLibre"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  /api/v1/operaciones/custodia:
    get:
      summary: Custodia física, libre y comprometida por Vendedor y lote
      tags:
        - Operaciones
      responses:
        "200":
          description: Consulta correcta.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Custodia"
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
      parameters:
        - in: query
          name: page
          schema:
            type: integer
            minimum: 1
            default: 1
        - in: query
          name: limit
          schema:
            type: integer
            minimum: 1
            maximum: 100
            default: 20
        - in: query
          name: vendedorId
          schema:
            type: string
            format: uuid
      description: ADMINISTRADOR puede filtrar Vendedor. VENDEDOR solo ve custodia propia; solicitar otro
        destinatario devuelve 403.
  /api/v1/operaciones/vendedores:
    get:
      summary: Vendedores activos para carga (ADMINISTRADOR)
      tags:
        - Operaciones
      responses:
        "200":
          description: Consulta correcta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        id:
                          type: string
                          format: uuid
                        nombre:
                          type: string
                      additionalProperties: false
                required:
                  - items
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"
  /api/v1/operaciones/conciliacion:
    get:
      summary: Conciliar distribución física y custodia (ADMINISTRADOR)
      tags:
        - Operaciones
      responses:
        "200":
          description: Consulta correcta.
          content:
            application/json:
              schema:
                type: object
                properties:
                  conciliado:
                    type: boolean
                  items:
                    type: array
                    items:
                      type: object
                      properties:
                        loteId:
                          type: string
                          format: uuid
                        codigo:
                          type: string
                        fisico: &a1
                          type: integer
                        custodia: *a1
                        sinResponsable: *a1
                        diferencia: *a1
                      additionalProperties: false
                required:
                  - items
                  - conciliado
                additionalProperties: false
        "400":
          $ref: "#/components/responses/Error400"
        "401":
          $ref: "#/components/responses/Error401"
        "403":
          $ref: "#/components/responses/Error403"
        "404":
          $ref: "#/components/responses/Error404"
        "409":
          $ref: "#/components/responses/Error409"

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      schema: { type: string, format: uuid }
  schemas:
    ProductoEntrada:
      type: object
      properties:
        codigo: { type: string }
        nombre: { type: string }
        familia: { type: string }
        presentacion: { type: string }
        pesoGramos: { type: integer, minimum: 1 }
        precioBob: { type: number, minimum: 0 }
        validacionComercial:
          type: string
          enum:
            - PROVISIONAL
            - VALIDADO
          default: PROVISIONAL
    ApiError:
      type: object
      required: [ statusCode, error, message, path, timestamp ]
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        path: { type: string }
        timestamp: { type: string, format: date-time }
    FamiliaEntrada:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 70
        descripcion:
          type: string
          maxLength: 1500
        imagenId:
          type: string
          format: uuid
          nullable: true
        activo: &a1
          type: boolean
        publicado: *a1
        orden:
          type: integer
          minimum: 0
          maximum: 100000
      required:
        - nombre
      additionalProperties: false
    ProductoComercialEntrada:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: string
          maxLength: 1500
        imagenId:
          type: string
          format: uuid
          nullable: true
        activo: &a1
          type: boolean
        publicado: *a1
        orden:
          type: integer
          minimum: 0
          maximum: 100000
        familiaId:
          type: string
          format: uuid
        caracteristicas:
          type: string
          maxLength: 2000
      required:
        - nombre
        - familiaId
      additionalProperties: false
    PresentacionEntrada:
      type: object
      properties:
        codigo:
          type: string
          maxLength: 40
        productoComercialId:
          type: string
          format: uuid
        presentacion:
          type: string
          maxLength: 100
        tipoEmpaque:
          type: string
          maxLength: 100
        pesoGramos:
          type: integer
          minimum: 1
        precioBob:
          oneOf:
            - type: string
              pattern: ^[0-9]{1,10}(\.[0-9]{1,2})?$
            - type: number
              minimum: 0
          description: Se recomienda enviar decimal como texto. Se conserva con NUMERIC; nunca publicar un valor
            provisional.
        activo:
          type: boolean
        validacionComercial:
          type: string
          enum:
            - PROVISIONAL
            - VALIDADO
          default: PROVISIONAL
      required:
        - codigo
        - productoComercialId
        - presentacion
        - tipoEmpaque
        - pesoGramos
        - precioBob
      additionalProperties: false
    FamiliaEdicion:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 70
        descripcion:
          type: string
          maxLength: 1500
        imagenId:
          type: string
          format: uuid
          nullable: true
        activo: &a1
          type: boolean
        publicado: *a1
        orden:
          type: integer
          minimum: 0
          maximum: 100000
      additionalProperties: false
      minProperties: 1
    Familia:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 70
        descripcion:
          type: string
          maxLength: 1500
        imagenId:
          type: string
          format: uuid
          nullable: true
        activo: &a1
          type: boolean
        publicado: *a1
        orden:
          type: integer
          minimum: 0
          maximum: 100000
        id:
          type: string
          format: uuid
        creadoEn: &a2
          type: string
          format: date-time
        actualizadoEn: *a2
        imagen:
          type: string
          nullable: true
        imagenOriginal:
          type: string
          nullable: true
    ProductoComercialEdicion:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: string
          maxLength: 1500
        imagenId:
          type: string
          format: uuid
          nullable: true
        activo: &a1
          type: boolean
        publicado: *a1
        orden:
          type: integer
          minimum: 0
          maximum: 100000
        familiaId:
          type: string
          format: uuid
        caracteristicas:
          type: string
          maxLength: 2000
      additionalProperties: false
      minProperties: 1
    ProductoComercial:
      type: object
      properties:
        nombre:
          type: string
          minLength: 1
          maxLength: 120
        descripcion:
          type: string
          maxLength: 1500
        imagenId:
          type: string
          format: uuid
          nullable: true
        activo: &a1
          type: boolean
        publicado: *a1
        orden:
          type: integer
          minimum: 0
          maximum: 100000
        familiaId: &a2
          type: string
          format: uuid
        caracteristicas:
          type: string
          maxLength: 2000
        id: *a2
        creadoEn: &a3
          type: string
          format: date-time
        actualizadoEn: *a3
        imagen:
          type: string
          nullable: true
        imagenOriginal:
          type: string
          nullable: true
    PresentacionEdicion:
      type: object
      properties:
        codigo:
          type: string
          maxLength: 40
        productoComercialId:
          type: string
          format: uuid
        presentacion:
          type: string
          maxLength: 100
        tipoEmpaque:
          type: string
          maxLength: 100
        pesoGramos:
          type: integer
          minimum: 1
        precioBob:
          oneOf:
            - type: string
              pattern: ^[0-9]{1,10}(\.[0-9]{1,2})?$
            - type: number
              minimum: 0
          description: Se recomienda enviar decimal como texto. Se conserva con NUMERIC; nunca publicar un valor
            provisional.
        activo:
          type: boolean
        validacionComercial:
          type: string
          enum:
            - PROVISIONAL
            - VALIDADO
          default: PROVISIONAL
      additionalProperties: false
      minProperties: 1
    Presentacion:
      type: object
      properties:
        codigo:
          type: string
          maxLength: 40
        productoComercialId: &a1
          type: string
          format: uuid
        presentacion:
          type: string
          maxLength: 100
        tipoEmpaque:
          type: string
          maxLength: 100
        pesoGramos:
          type: integer
          minimum: 1
        precioBob:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
          example: "30.20"
        activo:
          type: boolean
        validacionComercial:
          type: string
          enum:
            - PROVISIONAL
            - VALIDADO
            - LEGADO
        id: *a1
        creadoEn: &a2
          type: string
          format: date-time
        actualizadoEn: *a2
        validadoEn:
          type: string
          format: date-time
          nullable: true
        validadoPor:
          type: string
          format: uuid
          nullable: true
    ProductoPublico:
      type: object
      properties:
        id:
          type: string
          format: uuid
        nombre: &a1
          type: string
        descripcion: *a1
        caracteristicas: *a1
        orden:
          type: integer
        imagen:
          type: string
          nullable: true
      required:
        - id
        - nombre
        - descripcion
        - caracteristicas
        - orden
        - imagen
      additionalProperties: false
    FamiliaPublica:
      type: object
      properties:
        id:
          type: string
          format: uuid
        slug: &a1
          type: string
        nombre: *a1
        descripcion: *a1
        orden:
          type: integer
        imagen:
          type: string
          nullable: true
        productos:
          type: array
          items:
            $ref: "#/components/schemas/ProductoPublico"
      required:
        - id
        - slug
        - nombre
        - descripcion
        - orden
        - imagen
        - productos
      additionalProperties: false
    CatalogoPublico:
      type: object
      properties:
        familias:
          type: array
          items:
            $ref: "#/components/schemas/FamiliaPublica"
      required:
        - familias
      additionalProperties: false
    SalidaMostradorEntrada:
      type: object
      properties:
        operacionClave: &a1
          type: string
          format: uuid
        detalles:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            properties:
              productoId: *a1
              cantidad:
                type: integer
                minimum: 1
            required:
              - productoId
              - cantidad
            additionalProperties: false
      required:
        - operacionClave
        - detalles
      additionalProperties: false
    SalidaVendedorEntrada:
      type: object
      properties:
        operacionClave: &a1
          type: string
          format: uuid
        detalles:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            properties:
              productoId: *a1
              cantidad:
                type: integer
                minimum: 1
            required:
              - productoId
              - cantidad
            additionalProperties: false
        latitud:
          type: number
          minimum: -90
          maximum: 90
        longitud:
          type: number
          minimum: -180
          maximum: 180
        precisionMetros:
          type: number
          minimum: 0
          maximum: 100000
      required:
        - operacionClave
        - detalles
        - latitud
        - longitud
        - precisionMetros
      additionalProperties: false
    CargaEntrada:
      type: object
      properties:
        operacionClave: &a1
          type: string
          format: uuid
        detalles:
          type: array
          minItems: 1
          maxItems: 50
          items:
            type: object
            properties:
              productoId: *a1
              cantidad:
                type: integer
                minimum: 1
            required:
              - productoId
              - cantidad
            additionalProperties: false
        vendedorId: *a1
      required:
        - operacionClave
        - detalles
        - vendedorId
      additionalProperties: false
    DevolucionEntrada:
      type: object
      properties:
        operacionClave: &a1
          type: string
          format: uuid
        motivo:
          type: string
          minLength: 1
          maxLength: 300
        lotes:
          type: array
          minItems: 1
          maxItems: 100
          items:
            type: object
            properties:
              loteId: *a1
              cantidad:
                type: integer
                minimum: 1
            required:
              - loteId
              - cantidad
            additionalProperties: false
      required:
        - operacionClave
        - motivo
        - lotes
      additionalProperties: false
    RecepcionEntrada:
      type: object
      properties:
        operacionClave:
          type: string
          format: uuid
        observacion:
          type: string
          maxLength: 300
      required:
        - operacionClave
      additionalProperties: false
    ReversionEntrada:
      type: object
      properties:
        operacionClave:
          type: string
          format: uuid
        motivo:
          type: string
          minLength: 1
          maxLength: 300
        recepcionFisicaConfirmada:
          type: boolean
          enum:
            - true
      required:
        - operacionClave
        - motivo
        - recepcionFisicaConfirmada
      additionalProperties: false
    OperacionResumen:
      type: object
      properties:
        id: &a1
          type: string
          format: uuid
        tipo:
          type: string
          enum:
            - SALIDA_DIRECTA
            - CARGA
            - DEVOLUCION
            - REVERSION
        estado:
          type: string
          enum:
            - CONFIRMADA
            - PENDIENTE_RECEPCION
        creadoEn:
          type: string
          format: date-time
        usuarioId: *a1
        vendedorId:
          type: string
          format: uuid
          nullable: true
        responsable:
          type: string
        vendedorNombre:
          type: string
          nullable: true
        unidades:
          type: integer
        reversionId:
          type: string
          format: uuid
          nullable: true
    ProductoHistorico:
      type: object
      properties:
        codigo: &a1
          type: string
        nombre: *a1
        familia: *a1
        presentacion: *a1
        pesoGramos:
          type: integer
        tipoEmpaque: *a1
        validacionComercial: *a1
      additionalProperties: false
    DetalleOperacion:
      type: object
      properties:
        id: &a1
          type: string
          format: uuid
        operacionId: *a1
        productoId: *a1
        cantidad: &a2
          type: integer
        productoHistorico:
          $ref: "#/components/schemas/ProductoHistorico"
        precioUnitarioBob:
          type: string
          pattern: ^[0-9]+\.[0-9]{2}$
          example: "30.20"
          nullable: true
        lotes:
          type: array
          items:
            type: object
            properties:
              loteId: *a1
              codigo: &a3
                type: string
              cantidad: *a2
              condicionAlRegistrar: *a3
              movimientoId:
                type: string
                format: uuid
                nullable: true
            additionalProperties: false
    Operacion:
      type: object
      required:
        - id
        - operacionClave
        - tipo
        - estado
        - detalles
        - eventos
      properties:
        id: &a1
          type: string
          format: uuid
        tipo:
          type: string
          enum:
            - SALIDA_DIRECTA
            - CARGA
            - DEVOLUCION
            - REVERSION
        estado:
          type: string
          enum:
            - CONFIRMADA
            - PENDIENTE_RECEPCION
        creadoEn: &a3
          type: string
          format: date-time
        usuarioId: *a1
        vendedorId:
          type: string
          format: uuid
          nullable: true
        responsable: &a2
          type: string
        vendedorNombre:
          type: string
          nullable: true
        unidades:
          type: integer
        reversionId:
          type: string
          format: uuid
          nullable: true
        operacionClave: *a1
        clienteId:
          type: string
          format: uuid
          nullable: true
        clienteNombre:
          type: string
          nullable: true
        latitud:
          type: string
          nullable: true
        longitud:
          type: string
          nullable: true
        precisionM:
          type: string
          nullable: true
        solicitud:
          type: object
        motivo:
          type: string
          nullable: true
        revierteId:
          type: string
          format: uuid
          nullable: true
        detalles:
          type: array
          items:
            $ref: "#/components/schemas/DetalleOperacion"
        eventos:
          type: array
          items:
            type: object
            properties:
              accion: *a2
              usuarioId: *a1
              responsable: *a2
              solicitud:
                type: object
              creadoEn: *a3
    DisponibilidadLibre:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              productoId:
                type: string
                format: uuid
              codigo: &a1
                type: string
              nombre: *a1
              presentacion: *a1
              cantidadDisponible: &a2
                type: integer
              cantidadComprometida: *a2
      required:
        - items
      additionalProperties: false
    Custodia:
      type: object
      properties:
        items:
          type: array
          items:
            type: object
            properties:
              vendedorId:
                type: string
                format: uuid
                nullable: true
              vendedorNombre:
                type: string
                nullable: true
              loteId: &a1
                type: string
                format: uuid
              loteCodigo: &a2
                type: string
              productoId: *a1
              nombre: *a2
              codigo: *a2
              presentacion: *a2
              condicion: *a2
              venceEl:
                type: string
                format: date
              finalidad:
                type: string
                enum:
                  - LIBRE
                  - PEDIDO
              cantidad: &a3
                type: integer
              libre: *a3
              pendiente: *a3
              elegible:
                type: boolean
        page: *a3
        limit: *a3
      required:
        - items
        - page
        - limit
      additionalProperties: false
  responses:
    Error400:
      description: Entrada inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error401:
      description: No autenticado
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error403:
      description: Autenticado sin permiso
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error404:
      description: Recurso inexistente
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error409:
      description: Conflicto de negocio o estado
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error500:
      description: Error interno genérico; no expone trazas ni SQL
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error503:
      description: Servicio externo temporalmente no disponible
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

security:
  - bearerAuth: []
