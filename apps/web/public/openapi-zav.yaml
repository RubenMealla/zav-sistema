openapi: 3.0.3
info:
  title: ZAV API
  version: 1.0.0
  description: >
    Contrato interactivo de la API REST de ZAV para comprobación manual y automatizada.
    Usa "Authorize" con un JWT obtenido desde POST /api/v1/auth/login.
    Los cuerpos y parámetros incluyen ejemplos editables para acelerar la ejecución desde Swagger UI.
    En operaciones con identificadores UUID se debe reemplazar el valor de ejemplo por el ID retornado en el paso anterior.
    El visor muestra respuestas reales de la API; los conflictos de negocio se representan con HTTP 409.
servers:
  - url: /api/swagger/proxy
    description: Proxy seguro del visor Swagger hacia la API ZAV
tags:
  - name: Salud
  - name: Autenticación
  - name: Productos
  - name: Lotes
  - name: Movimientos
  - name: Clientes
  - name: Pedidos
  - name: Geografía
  - name: Administración
paths:
  /api/v1/salud:
    get:
      tags: [Salud]
      security: []
      summary: Comprobar disponibilidad de la API
      responses:
        '200':
          description: API disponible
          content:
            application/json:
              schema:
                type: object
                required: [estado]
                properties:
                  estado: { type: string, example: ok }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/auth/login:
    post:
      tags: [Autenticación]
      security: []
      summary: Iniciar sesión
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [identificador, contrasena]
              properties:
                identificador: { type: string, example: admin@saf.ts }
                contrasena: { type: string, format: password, example: "12345678" }
            examples:
              administrador:
                summary: Cuenta de demostración · Administrador
                value: { identificador: admin@saf.ts, contrasena: "12345678" }
              vendedor:
                summary: Cuenta de demostración · Vendedor
                value: { identificador: vendedor@saf.ts, contrasena: "12345678" }
              credenciales_invalidas:
                summary: Caso de error 401
                value: { identificador: usuario.invalido@zav.test, contrasena: incorrecta }
      responses:
        '200':
          description: Sesión iniciada
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/auth/me:
    get:
      tags: [Autenticación]
      summary: Consultar usuario autenticado
      responses:
        '200': { description: Perfil actual }
        '401': { $ref: '#/components/responses/Error401' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/productos:
    get:
      tags: [Productos]
      summary: Listar productos
      parameters:
        - { in: query, name: q, example: jamon, schema: { type: string } }
        - { in: query, name: activo, example: true, schema: { type: boolean } }
        - { in: query, name: page, example: 1, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, example: 20, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Lista paginada }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '500': { $ref: '#/components/responses/Error500' }
    post:
      tags: [Productos]
      summary: Registrar producto
      description: Requiere rol ADMINISTRADOR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
            examples:
              registro:
                summary: Registro válido
                value:
                  codigo: SWAGGER-PROD-001
                  nombre: Producto de demostración Swagger
                  familia: Fiambres
                  presentacion: Unidad de 250 g
                  pesoGramos: 250
                  precioBob: 19.5
              validacion_400:
                summary: Caso de error 400
                value:
                  codigo: ""
                  nombre: ""
                  familia: QA
                  presentacion: Unidad
                  pesoGramos: 0
                  precioBob: -1
      responses:
        '201': { description: Producto creado }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/productos/{id}:
    get:
      tags: [Productos]
      summary: Consultar producto
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Producto }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '500': { $ref: '#/components/responses/Error500' }
    patch:
      tags: [Productos]
      summary: Editar producto
      description: Requiere rol ADMINISTRADOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ProductoEntrada' }
      responses:
        '200': { description: Producto actualizado }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/productos/{id}/baja:
    patch:
      tags: [Productos]
      summary: Desactivar producto
      description: Requiere rol ADMINISTRADOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Producto desactivado }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/lotes:
    get:
      tags: [Lotes]
      summary: Listar lotes
      description: Requiere rol ADMINISTRADOR.
      responses:
        '200': { description: Lista paginada }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '500': { $ref: '#/components/responses/Error500' }
    post:
      tags: [Lotes]
      summary: Registrar lote e ingreso inicial
      description: Requiere rol ADMINISTRADOR. Reemplazar productoId por un ID obtenido desde GET /api/v1/productos.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoteEntrada' }
            examples:
              ingreso_valido:
                summary: Ingreso inicial
                value:
                  operacionClave: 11111111-1111-4111-8111-111111111111
                  productoId: 22222222-2222-4222-8222-222222222222
                  codigo: SWAGGER-LOTE-001
                  elaboradoEl: "2026-10-01"
                  venceEl: "2026-12-31"
                  cantidadInicial: 10
                  ubicacionCodigo: PRODUCCION_ALMACENAMIENTO
              cantidad_invalida_400:
                summary: Caso de error 400
                value:
                  operacionClave: 11111111-1111-4111-8111-111111111112
                  productoId: 22222222-2222-4222-8222-222222222222
                  codigo: SWAGGER-LOTE-INVALIDO
                  elaboradoEl: "2026-10-01"
                  venceEl: "2026-12-31"
                  cantidadInicial: 0
                  ubicacionCodigo: PRODUCCION_ALMACENAMIENTO
      responses:
        '201': { description: Lote creado }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/lotes/{id}:
    get:
      tags: [Lotes]
      summary: Consultar lote
      description: Requiere rol ADMINISTRADOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Lote }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/lotes/{id}/liberar:
    post:
      tags: [Lotes]
      summary: Liberar lote
      description: Requiere rol ADMINISTRADOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CondicionLoteEntrada' }
            example:
              operacionClave: 33333333-3333-4333-8333-333333333333
              motivo: Verificación manual desde Swagger
      responses:
        '201': { description: Condición actualizada }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/lotes/{id}/bloquear:
    post:
      tags: [Lotes]
      summary: Bloquear lote
      description: Requiere rol ADMINISTRADOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CondicionLoteEntrada' }
            example:
              operacionClave: 33333333-3333-4333-8333-333333333334
              motivo: Bloqueo de prueba desde Swagger
      responses:
        '201': { description: Condición actualizada }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/lotes/{id}/condiciones:
    get:
      tags: [Lotes]
      summary: Consultar historial de condición del lote
      description: Requiere rol ADMINISTRADOR.
      parameters:
        - { $ref: '#/components/parameters/Id' }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Historial paginado }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/movimientos:
    get:
      tags: [Movimientos]
      summary: Listar movimientos de un lote
      description: Requiere rol ADMINISTRADOR.
      parameters:
        - { in: query, name: loteId, required: true, example: 22222222-2222-4222-8222-222222222222, schema: { type: string, format: uuid } }
        - { in: query, name: page, example: 1, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, example: 20, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Movimientos paginados }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/movimientos/traslado:
    post:
      tags: [Movimientos]
      summary: Registrar traslado de inventario
      description: Requiere rol ADMINISTRADOR. Reemplazar loteId por un lote real.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TrasladoEntrada' }
            examples:
              traslado_valido:
                summary: Traslado válido
                value:
                  operacionClave: 44444444-4444-4444-8444-444444444444
                  loteId: 22222222-2222-4222-8222-222222222222
                  origenCodigo: PRODUCCION_ALMACENAMIENTO
                  destinoCodigo: VENTA_DESPACHO
                  cantidad: 2
                  referencia: SWAGGER-TRASLADO
              saldo_insuficiente_409:
                summary: Caso de error 409
                value:
                  operacionClave: 44444444-4444-4444-8444-444444444445
                  loteId: 22222222-2222-4222-8222-222222222222
                  origenCodigo: PRODUCCION_ALMACENAMIENTO
                  destinoCodigo: VENTA_DESPACHO
                  cantidad: 999999
                  referencia: SWAGGER-SALDO-INSUFICIENTE
      responses:
        '201': { description: Traslado creado }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/clientes:
    get:
      tags: [Clientes]
      summary: Listar clientes
      description: Requiere rol VENDEDOR.
      responses:
        '200': { description: Lista paginada }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '500': { $ref: '#/components/responses/Error500' }
    post:
      tags: [Clientes]
      summary: Registrar cliente georreferenciado
      description: Requiere rol VENDEDOR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClienteEntrada' }
            examples:
              cliente_valido:
                summary: Registro válido
                value:
                  nombre: Cliente Swagger Tarija
                  telefono: "70000000"
                  direccion: Zona central, Tarija
                  latitud: -21.535
                  longitud: -64.73
              cliente_invalido_400:
                summary: Caso de error 400
                value:
                  nombre: Cliente sin ubicación
                  telefono: "70000000"
                  direccion: ""
      responses:
        '201': { description: Cliente creado }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/clientes/{id}:
    get:
      tags: [Clientes]
      summary: Consultar cliente
      description: Requiere rol VENDEDOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Cliente }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '500': { $ref: '#/components/responses/Error500' }
    patch:
      tags: [Clientes]
      summary: Editar cliente
      description: Requiere rol VENDEDOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Cliente actualizado }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/clientes/{id}/ubicacion:
    patch:
      tags: [Clientes]
      summary: Actualizar ubicación confirmada del cliente
      description: Requiere rol VENDEDOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Cliente actualizado }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/clientes/{id}/estado:
    patch:
      tags: [Clientes]
      summary: Activar o desactivar cliente
      description: Requiere rol VENDEDOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Estado actualizado }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/pedidos:
    get:
      tags: [Pedidos]
      summary: Listar pedidos propios
      description: Requiere rol VENDEDOR.
      parameters:
        - { in: query, name: estado, schema: { type: string } }
        - { in: query, name: page, schema: { type: integer, minimum: 1 } }
        - { in: query, name: limit, schema: { type: integer, minimum: 1 } }
      responses:
        '200': { description: Lista paginada }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '500': { $ref: '#/components/responses/Error500' }
    post:
      tags: [Pedidos]
      summary: Registrar pedido
      description: Requiere rol VENDEDOR. Reemplazar clienteId y productoId por IDs obtenidos previamente.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PedidoEntrada' }
            examples:
              pedido_valido:
                summary: Pedido válido
                value:
                  clienteId: 55555555-5555-4555-8555-555555555555
                  observacion: Pedido de prueba desde Swagger
                  detalles:
                    - productoId: 66666666-6666-4666-8666-666666666666
                      cantidad: 1
              sobreventa_409:
                summary: Caso de error 409
                value:
                  clienteId: 55555555-5555-4555-8555-555555555555
                  observacion: Prueba de stock insuficiente
                  detalles:
                    - productoId: 66666666-6666-4666-8666-666666666666
                      cantidad: 999999
      responses:
        '201': { description: Pedido REGISTRADO }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/pedidos/{id}:
    get:
      tags: [Pedidos]
      summary: Consultar pedido propio
      description: Requiere rol VENDEDOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Pedido }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '500': { $ref: '#/components/responses/Error500' }
    patch:
      tags: [Pedidos]
      summary: Editar pedido antes del retiro
      description: Requiere rol VENDEDOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      responses:
        '200': { description: Pedido actualizado }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/pedidos/{id}/cancelacion:
    post:
      tags: [Pedidos]
      summary: Anular pedido antes del retiro
      description: Requiere rol VENDEDOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [motivo]
              properties:
                motivo: { type: string, example: Registro incorrecto detectado antes del retiro }
      responses:
        '201': { description: Pedido CANCELADO }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/pedidos/{id}/retiro:
    post:
      tags: [Pedidos]
      summary: Retirar pedido para reparto
      description: Requiere rol VENDEDOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OperacionIdempotente' }
            example: { operacionClave: 77777777-7777-4777-8777-777777777777 }
      responses:
        '201': { description: Pedido EN_DISTRIBUCION }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/pedidos/retiros:
    post:
      tags: [Pedidos]
      summary: Retirar varios pedidos
      description: Requiere rol VENDEDOR.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RetirosEntrada' }
            example:
              retiros:
                - pedidoId: 88888888-8888-4888-8888-888888888881
                  operacionClave: 99999999-9999-4999-8999-999999999991
                - pedidoId: 88888888-8888-4888-8888-888888888882
                  operacionClave: 99999999-9999-4999-8999-999999999992
      responses:
        '201': { description: Resultado completo, parcial o sin cambios }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/pedidos/{id}/entrega:
    post:
      tags: [Pedidos]
      summary: Confirmar entrega con GPS puntual
      description: Requiere rol VENDEDOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/EntregaEntrada' }
            examples:
              entrega_valida:
                summary: Entrega GPS válida
                value:
                  operacionClave: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa
                  latitud: -21.53549
                  longitud: -64.72956
                  precisionMetros: 8.5
              coordenada_invalida_400:
                summary: Caso de error 400
                value:
                  operacionClave: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaab
                  latitud: 120
                  longitud: -64.73
      responses:
        '201': { description: Pedido ENTREGADO }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/pedidos/planificacion:
    post:
      tags: [Pedidos]
      summary: Sugerir secuencia geográfica de reparto
      description: Requiere rol VENDEDOR. No es optimización vial. Reemplazar pedidoIds por pedidos REGISTRADOS con destino GPS.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PlanificacionEntrada' }
            example:
              pedidoIds:
                - 88888888-8888-4888-8888-888888888881
                - 88888888-8888-4888-8888-888888888882
              origenTipo: DESPACHO
      responses:
        '201': { description: Secuencia sugerida }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/pedidos/disponibilidad:
    get:
      tags: [Pedidos]
      summary: Consultar disponibilidad comercial
      description: Requiere rol VENDEDOR.
      responses:
        '200': { description: Productos y cantidades disponibles }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/admin/pedidos:
    get:
      tags: [Administración]
      summary: Auditar pedidos y vendedor responsable
      description: Requiere rol ADMINISTRADOR.
      responses:
        '200': { description: Lista paginada }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/geografia/geocodificar:
    get:
      tags: [Geografía]
      summary: Buscar direcciones en Tarija mediante Geoapify
      description: Requiere rol VENDEDOR. La clave del proveedor permanece en backend.
      parameters:
        - { in: query, name: q, required: true, example: Plaza Luis de Fuentes Tarija, schema: { type: string, minLength: 2, maxLength: 200 } }
      responses:
        '200': { description: Coincidencias }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/geografia/autocompletar:
    get:
      tags: [Geografía]
      summary: Autocompletar direcciones en Tarija
      description: Requiere rol VENDEDOR.
      parameters:
        - { in: query, name: q, required: true, example: Plaza Luis de Fuentes Tarija, schema: { type: string, minLength: 2, maxLength: 200 } }
      responses:
        '200': { description: Coincidencias }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/geografia/reversa:
    get:
      tags: [Geografía]
      summary: Obtener dirección desde coordenadas
      description: Requiere rol VENDEDOR.
      parameters:
        - { in: query, name: latitud, required: true, example: -21.535, schema: { type: number } }
        - { in: query, name: longitud, required: true, example: -64.73, schema: { type: number } }
      responses:
        '200': { description: Dirección normalizada }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '503': { $ref: '#/components/responses/Error503' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/ubicaciones/venta-despacho:
    get:
      tags: [Geografía]
      summary: Consultar punto de Venta y Despacho
      responses:
        '200': { description: Ubicación }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '500': { $ref: '#/components/responses/Error500' }

  /api/v1/ubicaciones/{id}/georreferencia:
    patch:
      tags: [Geografía]
      summary: Configurar georreferencia física de Venta y Despacho
      description: Requiere rol ADMINISTRADOR.
      parameters: [ { $ref: '#/components/parameters/Id' } ]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/GeorreferenciaEntrada' }
            example: { latitud: -21.535, longitud: -64.73 }
      responses:
        '200': { description: Ubicación actualizada }
        '400': { $ref: '#/components/responses/Error400' }
        '401': { $ref: '#/components/responses/Error401' }
        '403': { $ref: '#/components/responses/Error403' }
        '404': { $ref: '#/components/responses/Error404' }
        '409': { $ref: '#/components/responses/Error409' }
        '500': { $ref: '#/components/responses/Error500' }

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  parameters:
    Id:
      in: path
      name: id
      required: true
      description: Sustituir por un UUID real devuelto por el endpoint de creación correspondiente. El valor de ejemplo sirve para probar 404.
      example: 00000000-0000-4000-8000-000000000404
      schema: { type: string, format: uuid }
  schemas:
    ProductoEntrada:
      type: object
      required: [codigo, nombre, familia, presentacion, pesoGramos, precioBob]
      properties:
        codigo: { type: string, example: SWAGGER-PROD-001 }
        nombre: { type: string, example: Producto de demostración Swagger }
        familia: { type: string, example: Fiambres }
        presentacion: { type: string, example: Unidad de 250 g }
        pesoGramos: { type: integer, minimum: 1, example: 250 }
        precioBob: { type: number, minimum: 0, example: 19.5 }
    LoteEntrada:
      type: object
      required: [operacionClave, productoId, codigo, elaboradoEl, venceEl, cantidadInicial, ubicacionCodigo]
      properties:
        operacionClave: { type: string, format: uuid, example: 11111111-1111-4111-8111-111111111111 }
        productoId: { type: string, format: uuid, example: 22222222-2222-4222-8222-222222222222 }
        codigo: { type: string, example: LOTE-SWAGGER-001 }
        elaboradoEl: { type: string, format: date, example: 2026-10-01 }
        venceEl: { type: string, format: date, example: 2026-12-31 }
        cantidadInicial: { type: integer, minimum: 1, example: 10 }
        ubicacionCodigo: { type: string, enum: [PRODUCCION_ALMACENAMIENTO, VENTA_DESPACHO], example: PRODUCCION_ALMACENAMIENTO }
    CondicionLoteEntrada:
      type: object
      required: [operacionClave, motivo]
      properties:
        operacionClave: { type: string, format: uuid, example: 33333333-3333-4333-8333-333333333333 }
        motivo: { type: string, example: Liberación para venta }
    TrasladoEntrada:
      type: object
      required: [operacionClave, loteId, origenCodigo, destinoCodigo, cantidad]
      properties:
        operacionClave: { type: string, format: uuid, example: 44444444-4444-4444-8444-444444444444 }
        loteId: { type: string, format: uuid, example: 55555555-5555-4555-8555-555555555555 }
        origenCodigo: { type: string, example: PRODUCCION_ALMACENAMIENTO }
        destinoCodigo: { type: string, example: VENTA_DESPACHO }
        cantidad: { type: integer, minimum: 1, example: 2 }
        referencia: { type: string, example: Prueba manual Swagger }
    ClienteEntrada:
      type: object
      required: [nombre, direccion, latitud, longitud]
      properties:
        nombre: { type: string, example: Cliente Swagger Tarija }
        telefono: { type: string, example: "70000000" }
        direccion: { type: string, example: Zona central, Tarija }
        latitud: { type: number, example: -21.535 }
        longitud: { type: number, example: -64.73 }
    PedidoEntrada:
      type: object
      required: [clienteId, detalles]
      properties:
        clienteId: { type: string, format: uuid, example: 66666666-6666-4666-8666-666666666666 }
        observacion: { type: string, example: Pedido de demostración Swagger }
        detalles:
          type: array
          minItems: 1
          items:
            type: object
            required: [productoId, cantidad]
            properties:
              productoId: { type: string, format: uuid, example: 77777777-7777-4777-8777-777777777777 }
              cantidad: { type: integer, minimum: 1, example: 2 }
    OperacionIdempotente:
      type: object
      required: [operacionClave]
      properties:
        operacionClave: { type: string, format: uuid, example: 88888888-8888-4888-8888-888888888888 }
    RetirosEntrada:
      type: object
      required: [retiros]
      properties:
        retiros:
          type: array
          minItems: 1
          items:
            type: object
            required: [pedidoId, operacionClave]
            properties:
              pedidoId: { type: string, format: uuid, example: 99999999-9999-4999-8999-999999999999 }
              operacionClave: { type: string, format: uuid, example: aaaaaaaa-aaaa-4aaa-8aaa-aaaaaaaaaaaa }
    EntregaEntrada:
      type: object
      required: [operacionClave, latitud, longitud]
      properties:
        operacionClave: { type: string, format: uuid, example: bbbbbbbb-bbbb-4bbb-8bbb-bbbbbbbbbbbb }
        latitud: { type: number, minimum: -90, maximum: 90, example: -21.535 }
        longitud: { type: number, minimum: -180, maximum: 180, example: -64.73 }
        precisionMetros: { type: number, minimum: 0, example: 8.5 }
    PlanificacionEntrada:
      type: object
      required: [pedidoIds, origenTipo]
      properties:
        pedidoIds:
          type: array
          minItems: 2
          items: { type: string, format: uuid, example: cccccccc-cccc-4ccc-8ccc-cccccccccccc }
        origenTipo: { type: string, enum: [DESPACHO, ACTUAL], example: DESPACHO }
        origenActual:
          type: object
          properties:
            latitud: { type: number, example: -21.535 }
            longitud: { type: number, example: -64.73 }
    GeorreferenciaEntrada:
      type: object
      required: [latitud, longitud]
      properties:
        latitud: { type: number, example: -21.535 }
        longitud: { type: number, example: -64.73 }
    ApiError:
      type: object
      required: [statusCode, error, message, path, timestamp]
      properties:
        statusCode: { type: integer }
        error: { type: string }
        message:
          oneOf:
            - { type: string }
            - { type: array, items: { type: string } }
        path: { type: string }
        timestamp: { type: string, format: date-time }
  responses:
    Error400:
      description: Entrada inválida
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error401:
      description: No autenticado
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error403:
      description: Autenticado sin permiso
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error404:
      description: Recurso inexistente
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error409:
      description: Conflicto de negocio o estado
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error500:
      description: Error interno genérico; no expone trazas ni SQL
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }
    Error503:
      description: Servicio externo temporalmente no disponible
      content: { application/json: { schema: { $ref: '#/components/schemas/ApiError' } } }

security:
  - bearerAuth: []
